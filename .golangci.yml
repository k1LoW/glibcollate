version: "2"
run:
  timeout: 10m
linters:
  enable:
    - errorlint
    - godot
    - gosec
    - misspell
    - revive
    - funcorder
    - modernize
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false
  exclusions:
    rules:
      # The port reproduces the integer conversions of the C source on
      # purpose, so that it wraps and truncates exactly as strcoll_l does.
      - path: internal/strcoll/
        linters:
          - gosec
        text: G115
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
