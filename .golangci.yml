version: "2"
run:
  timeout: 10m
linters:
  enable:
    - errorlint
    - godot
    - gosec
    - misspell
    - revive
    - funcorder
    - modernize
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false
  exclusions:
    rules:
      # The ports reproduce the integer conversions of the C source on
      # purpose, so that they wrap and truncate exactly as glibc does.
      - path: internal/(strcoll|wctype)/
        linters:
          - gosec
        text: G115
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
